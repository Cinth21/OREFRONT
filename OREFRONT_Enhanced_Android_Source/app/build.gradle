plugins { id 'com.android.application' }
android {
    namespace 'com.student.orefront'
    compileSdk 35
    defaultConfig {
        applicationId 'com.student.orefront.enhanced'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '2.0.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
